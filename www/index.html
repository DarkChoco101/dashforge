<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>DashForge — Car Dashboard</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#e8eef6;font:15px/1.4 system-ui,Roboto,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none}
#app{display:flex;height:100vh;height:100dvh;width:100vw}
#stage{position:relative;flex:1;min-width:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#stage.alarm{box-shadow:inset 0 0 0 6px #ff2a2a}
#cv{display:block;position:absolute;inset:0}
#night{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .4s}
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px 12px;pointer-events:none;opacity:0;transition:opacity .3s}
.hud-on #hud{opacity:1}
.hud-on #hud *{pointer-events:auto}
.hud-l{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hud-r{display:flex;gap:8px}
.hud-r button{width:52px;height:52px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:rgba(15,20,30,.78);color:#fff;font-size:22px;cursor:pointer}
.hud-r button:active{transform:scale(.94)}
.pill{padding:5px 11px;border-radius:99px;font-size:13px;font-weight:700;background:rgba(15,20,30,.8);border:1px solid rgba(255,255,255,.15)}
.pill.ok{color:#5df2a0}.pill.warn{color:#ffd166}.pill.bad{color:#ff5c6c}.pill.rec{color:#ff5c6c}
#fps{font:12px monospace;color:#9fb0c8;background:rgba(0,0,0,.5);padding:2px 6px;border-radius:6px}
#fps:empty{display:none}
#dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:6px}
#dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.25);cursor:pointer}
#dots i.on{background:rgba(255,255,255,.85)}
#scrname{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:32px;font-weight:800;padding:12px 26px;border-radius:16px;background:rgba(0,0,0,.6);opacity:0;transition:opacity .3s;pointer-events:none}
#scrname.show{opacity:1}
#alertbar{position:absolute;left:50%;top:70px;transform:translateX(-50%) translateY(-20px);background:#c4162a;color:#fff;font-weight:800;font-size:22px;padding:10px 26px;border-radius:14px;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
#alertbar.show{opacity:1;transform:translateX(-50%)}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(30px);background:rgba(20,26,38,.96);border:1px solid #2c3a52;color:#fff;padding:12px 20px;border-radius:12px;opacity:0;transition:.3s;z-index:100;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
/* buttons & forms */
.btn{background:#1d2738;color:#e8eef6;border:1px solid #2d3b54;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;min-height:42px}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5}
.btn.primary{background:#2563eb;border-color:#3b7bff}.btn.danger{background:#3a1520;border-color:#6b2232;color:#ff9aa8}.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;min-height:34px;font-size:13px}.btn.big{font-size:20px;padding:14px 30px}.btn.on{background:#2563eb}
.link{background:none;border:0;color:#6ea8ff;cursor:pointer;font:inherit;text-decoration:underline}
input,select,textarea{background:#0f1622;color:#e8eef6;border:1px solid #2d3b54;border-radius:8px;padding:8px 10px;font:inherit;min-height:38px}
input[type=checkbox]{min-height:auto;width:20px;height:20px;accent-color:#3b7bff}
input[type=color]{padding:2px;width:46px;height:34px;min-height:34px}
input[type=range]{padding:0;accent-color:#3b7bff}
textarea{width:100%;min-height:90px}
.row{display:flex;gap:10px;align-items:center;margin:12px 0;flex-wrap:wrap}.row.between{justify-content:space-between}.row.center{justify-content:center}.row.wrap{flex-wrap:wrap}
.row input:not([type=checkbox]){flex:1;min-width:120px}
.hint{color:#8fa1ba;font-size:13.5px}.warn{color:#ffd166}.dim{color:#7d8ca3}.bad{color:#ff6b7a}.ok{color:#5df2a0}.info{color:#9fb0c8}
.chk{display:inline-flex;gap:8px;align-items:center}
.card{background:#111926;border:1px solid #233149;border-radius:14px;padding:14px;margin:12px 0}
/* modal */
.modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:50;}
.modal{background:#0b111b;border:1px solid #233149;border-radius:20px;width:min(760px,94vw);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal.wide{width:min(1100px,96vw)}
.modal header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #1d2a40}
.modal header h2{flex:1;margin:0;font-size:20px}
.modal header button{width:44px;height:44px;border-radius:12px;border:1px solid #2d3b54;background:#141d2c;color:#fff;font-size:22px;cursor:pointer}
.modal .body{padding:6px 18px 18px;overflow:auto;-webkit-overflow-scrolling:touch}
.modal h3{margin:18px 0 6px;font-size:15px;color:#9fb0c8;text-transform:uppercase;letter-spacing:.06em}
.lead{font-size:19px}.feat li{margin:6px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:12px}
.tile{background:#121b2a;border:1px solid #233149;border-radius:16px;padding:16px 12px;color:#e8eef6;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;font:inherit;min-height:112px}
.tile:active{background:#1a2740}.tile .ic{font-size:28px}.tile b{font-size:16px}.tile small{color:#8fa1ba}
.foot{color:#6f7f97;font-size:13px;margin-top:16px}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:12px}
.skin{background:#121b2a;border:2px solid #233149;border-radius:14px;overflow:hidden;cursor:pointer}
.skin.cur{border-color:#3b7bff}
.skin canvas{width:100%;display:block;aspect-ratio:16/9;background:#000}
.skin .meta{padding:8px 10px 0;display:flex;flex-direction:column}.skin .meta small{color:#8fa1ba}
.skin .acts{display:flex;gap:6px;padding:8px 10px 10px}
.srcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.src{background:#121b2a;border:2px solid #233149;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.src.on{border-color:#3b7bff}.src input{display:none}.src .ic{font-size:26px}.src small{color:#8fa1ba}
pre{white-space:pre-wrap;font-size:12px;max-height:200px;overflow:auto;background:#060a10;padding:8px;border-radius:8px}
.trips{display:flex;flex-direction:column;gap:8px}
.trip{background:#121b2a;border:1px solid #233149;border-radius:12px;padding:12px;cursor:pointer}
.trip .stats{display:flex;gap:14px;flex-wrap:wrap;color:#b6c4d8;font-size:14px;margin-top:4px}
.rec{color:#ff5c6c}
.route{width:100%;border-radius:12px;display:block;margin:8px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.kpis div{background:#121b2a;border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}.kpis small{color:#8fa1ba}.kpis b{font-size:19px}
.perfbig{text-align:center;padding:16px}#pf-state{font-size:22px;color:#ffd166}#pf-time{font-size:72px;font-weight:800;font-variant-numeric:tabular-nums}#pf-spd{color:#9fb0c8;font-size:18px}
table.res{width:100%;border-collapse:collapse;margin-top:8px}table.res td{padding:8px 10px;border-bottom:1px solid #1d2a40}table.res td:last-child{text-align:right;font-weight:700}
table.chk td:last-child{text-align:left}
.rep{font:12px monospace;margin-top:8px}
.dtc{padding:6px 0;border-bottom:1px solid #1d2a40}.dtc b{color:#ffd166;margin-right:8px}.dtc a{color:#6ea8ff}
.alert{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid #1d2a40}.alert input[type=text]{flex:1;min-width:140px}
.form label{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #141e2e}
.form label input[type=text]{max-width:55%}.form label input[type=number]{width:120px}.form label input[type=range]{width:200px}
/* media dock */
#dock{width:0;overflow:hidden;background:#090e16;border-left:1px solid #1d2a40;transition:width .25s;display:flex;flex-direction:column}
.dock-on #dock{width:min(40vw,520px);min-width:min(340px,50vw);overflow-y:auto;padding:0 12px 12px}
.dock-h{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
.dock-h .x{width:42px;height:42px;border-radius:10px;border:1px solid #2d3b54;background:#141d2c;color:#fff;font-size:18px}
.yt{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9;flex-shrink:0}
.ytwrap,.ytwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ytph{display:flex;align-items:center;justify-content:center;height:100%;color:#6f7f97;padding:20px;text-align:center}
.parked{position:absolute;inset:0;background:#05080d;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;font-weight:700;color:#ffd166}
.parked.show{display:flex}
.favs{display:flex;flex-wrap:wrap;gap:6px}
.fav{background:#141d2c;border:1px solid #2d3b54;border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer}.fav i{font-style:normal;margin-left:8px;color:#ff8a98}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px;margin:14px 0}
.app{background:none;border:0;color:#cfd9e8;display:flex;flex-direction:column;align-items:center;gap:6px;font:12.5px system-ui;cursor:pointer;padding:6px}
.app span{width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;font-weight:800}
.app:active span{transform:scale(.92)}
/* editor */
#edpanel{width:0;overflow:hidden;background:#0b111b;border-left:1px solid #1d2a40}
.editing #edpanel{width:320px;overflow-y:auto;padding:12px}
#edpanel h3{margin:6px 0 10px}
#edpanel label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:#9fb0c8;margin-bottom:8px}
#edpanel label.chk{flex-direction:row;align-items:center}
#edpanel label.cf{flex-direction:row;justify-content:space-between;align-items:center}
#edpanel label.cf span{display:flex;gap:6px}#edpanel label.cf select{width:100px}
#edpanel .pos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}#edpanel .pos input{width:100%;padding:6px}
.edhint{color:#9fb0c8;font-size:14px}
#edbar{position:absolute;top:8px;left:8px;right:8px;display:none;gap:6px;flex-wrap:wrap;background:rgba(10,15,24,.92);padding:8px;border-radius:14px;border:1px solid #2d3b54}
.editing #edbar{display:flex}.editing #hud,.editing #dots{display:none}
#edbar select{min-height:34px;padding:4px 8px}
.swatches{display:flex;flex-wrap:wrap;gap:6px}.sw{width:36px;height:36px;border-radius:10px;border:2px solid #2d3b54;cursor:pointer}
@media (max-width:700px){.editing #edpanel{width:240px}.hud-r button{width:44px;height:44px}}

.passenger.dock-on #dock{width:min(62vw,880px)}

</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="night"></div>
    <div id="alertbar"></div>
    <div id="scrname"></div>
    <div id="hud">
      <div class="hud-l"><span id="srcpill" class="pill">Demo</span><span id="trippill" class="pill rec" style="display:none"></span><span id="perfpill" class="pill warn" style="display:none"></span><span id="fps"></span></div>
      <div class="hud-r"><button id="btn-apps" title="All apps">⊞</button><button id="btn-trip" title="Trips">🗺</button><button id="btn-media" title="Media & apps">▶</button><button id="btn-full" title="Fullscreen">⛶</button><button id="btn-menu" title="Menu">☰</button></div>
    </div>
    <div id="dots"></div>
    <div id="edbar"></div>
  </div>
  <div id="edpanel"></div>
  <div id="dock"></div>
</div>
<div id="toast"></div>
<script>
/* ===== CORE: namespace, channels, units, storage ===== */
'use strict';
const RD = window.RD = {};
RD.W = 1280; RD.H = 720;
RD.VERSION = '1.0.0';

RD.store = {
  get(k, d) { try { const v = localStorage.getItem('rdx.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('rdx.' + k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};

RD.defaults = {
  units: 'metric', pressure: 'bar', ratios: '7.5,13,19,26,33,40', redline: 6500,
  night: false, brightness: 1, wake: true, fps: false, maxFps: 60, quality: 'auto',
  source: 'sim', skin: 'neon', screen: 0, tank: 45, fuelPrice: 105, volume: 0.6,
  voice: true, obdFast: '0C,0D,11', obdSlow: '05,0F,04,0B,10,42,2F,0E,5C,46'
};
RD.settings = Object.assign({}, RD.defaults, RD.store.get('settings', {}));
RD.saveSettings = () => RD.store.set('settings', RD.settings);
if (!RD.settings.modeSet) { RD.settings.mode = 'passenger'; RD.settings.skin = 'pglass'; RD.settings.source = 'gps'; RD.settings.screen = 0; RD.settings.modeSet = true; RD.saveSettings(); }
RD.passenger = () => RD.settings.mode === 'passenger';
RD.GPS_CH = ['speed', 'heading', 'altitude', 'gpsAcc', 'tripDist', 'tripTime', 'avgSpeed', 'maxSpeed', 'accelX', 'accelY', 'hp'];

/* Channels — canonical units: speed km/h, temp °C, boost bar, dist km, eco km/L */
RD.CH = {
  rpm:      { label: 'RPM', kind: '', unit: 'rpm', min: 0, max: 8000, dec: 0 },
  speed:    { label: 'Speed', kind: 'speed', min: 0, max: 240, dec: 0 },
  gear:     { label: 'Gear', kind: '', unit: '', min: -1, max: 6, dec: 0 },
  throttle: { label: 'Throttle', kind: '', unit: '%', min: 0, max: 100, dec: 0 },
  load:     { label: 'Engine Load', kind: '', unit: '%', min: 0, max: 100, dec: 0 },
  coolant:  { label: 'Coolant', kind: 'temp', min: 40, max: 130, dec: 0 },
  intake:   { label: 'Intake Air', kind: 'temp', min: -10, max: 80, dec: 0 },
  oiltemp:  { label: 'Oil Temp', kind: 'temp', min: 40, max: 150, dec: 0 },
  maf:      { label: 'MAF', kind: '', unit: 'g/s', min: 0, max: 200, dec: 1 },
  map:      { label: 'MAP', kind: '', unit: 'kPa', min: 0, max: 250, dec: 0 },
  boost:    { label: 'Boost', kind: 'pressure', min: -1, max: 1.5, dec: 2 },
  fuel:     { label: 'Fuel Level', kind: '', unit: '%', min: 0, max: 100, dec: 0 },
  volt:     { label: 'Battery', kind: '', unit: 'V', min: 10, max: 16, dec: 1 },
  timing:   { label: 'Timing Adv', kind: '', unit: '°', min: -10, max: 50, dec: 1 },
  afr:      { label: 'AFR', kind: '', unit: ':1', min: 10, max: 20, dec: 1 },
  ambient:  { label: 'Ambient', kind: 'temp', min: -10, max: 50, dec: 0 },
  fuelRate: { label: 'Fuel Rate', kind: '', unit: 'L/h', min: 0, max: 30, dec: 1 },
  eco:      { label: 'Instant Eco', kind: 'eco', min: 0, max: 40, dec: 1 },
  avgEco:   { label: 'Avg Eco', kind: 'eco', min: 0, max: 40, dec: 1 },
  accelX:   { label: 'Lateral G', kind: '', unit: 'g', min: -1.5, max: 1.5, dec: 2 },
  accelY:   { label: 'Long. G', kind: '', unit: 'g', min: -1.5, max: 1.5, dec: 2 },
  heading:  { label: 'Heading', kind: '', unit: '°', min: 0, max: 360, dec: 0 },
  altitude: { label: 'Altitude', kind: 'alt', min: 0, max: 3000, dec: 0 },
  gpsAcc:   { label: 'GPS Accuracy', kind: 'alt', min: 0, max: 50, dec: 0 },
  tripDist: { label: 'Trip', kind: 'dist', min: 0, max: 1000, dec: 1 },
  tripTime: { label: 'Trip Time', kind: 'time', min: 0, max: 36000, dec: 0 },
  avgSpeed: { label: 'Avg Speed', kind: 'speed', min: 0, max: 200, dec: 0 },
  maxSpeed: { label: 'Max Speed', kind: 'speed', min: 0, max: 300, dec: 0 },
  range:    { label: 'Range', kind: 'dist', min: 0, max: 900, dec: 0 },
  tripFuel: { label: 'Trip Fuel', kind: '', unit: 'L', min: 0, max: 100, dec: 2 },
  tripCost: { label: 'Trip Cost', kind: '', unit: '₹', min: 0, max: 10000, dec: 0 },
  hp:       { label: 'Est. Power', kind: '', unit: 'hp', min: 0, max: 300, dec: 0 },
  dtcCount: { label: 'Fault Codes', kind: '', unit: '', min: 0, max: 20, dec: 0 }
};
RD.chList = () => Object.keys(RD.CH);

RD.data = {};           // live raw values (canonical units)
RD.chList().forEach(k => RD.data[k] = 0);
RD.data.coolant = 25; RD.data.intake = 25; RD.data.oiltemp = 25; RD.data.volt = 12.4; RD.data.fuel = 70; RD.data.afr = 14.7;
RD.data.ambient = 28;

RD.imp = () => RD.settings.units === 'imperial';
RD.unitFor = (ch) => {
  const c = RD.CH[ch]; if (!c) return '';
  switch (c.kind) {
    case 'speed': return RD.imp() ? 'mph' : 'km/h';
    case 'temp': return RD.imp() ? '°F' : '°C';
    case 'pressure': return RD.settings.pressure;
    case 'dist': return RD.imp() ? 'mi' : 'km';
    case 'alt': return RD.imp() ? 'ft' : 'm';
    case 'eco': return RD.imp() ? 'mpg' : 'km/L';
    case 'time': return '';
    default: return c.unit || '';
  }
};
RD.toDisp = (ch, v) => {
  const c = RD.CH[ch]; if (!c || v == null || isNaN(v)) return v;
  const imp = RD.imp();
  switch (c.kind) {
    case 'speed': case 'dist': return imp ? v * 0.621371 : v;
    case 'temp': return imp ? v * 9 / 5 + 32 : v;
    case 'pressure': return RD.settings.pressure === 'psi' ? v * 14.5038 : RD.settings.pressure === 'kPa' ? v * 100 : v;
    case 'alt': return imp ? v * 3.28084 : v;
    case 'eco': return imp ? v * 2.35215 : v;
    default: return v;
  }
};
RD.fmtTime = (s) => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = s % 60; return (h ? h + ':' : '') + String(m).padStart(h ? 2 : 1, '0') + ':' + String(ss).padStart(2, '0'); };
RD.fmt = (ch, v, dec) => {
  const c = RD.CH[ch];
  if (c && c.kind === 'time') return RD.fmtTime(v);
  if (ch === 'gear') return RD.gearText(v);
  const d = RD.toDisp(ch, v);
  if (d == null || isNaN(d)) return '--';
  const dd = dec != null ? dec : (c ? c.dec : 0);
  return Number(d).toFixed(dd);
};
RD.gearText = (g) => g === -1 ? 'R' : (!g ? 'N' : String(Math.round(g)));
RD.clamp = (v, a, b) => v < a ? a : v > b ? b : v;
RD.lerp = (a, b, t) => a + (b - a) * t;
RD.uid = () => Math.random().toString(36).slice(2, 9);
RD.clone = (o) => JSON.parse(JSON.stringify(o));
RD.niceStep = (range, target) => {
  const raw = range / (target || 8), p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p;
  return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * p;
};

/* Simple event bus */
RD.bus = { h: {}, on(e, f) { (this.h[e] = this.h[e] || []).push(f); }, emit(e, a) { (this.h[e] || []).forEach(f => { try { f(a); } catch (er) { console.error(er); } }); } };

/* Toast */
RD.toast = (msg, ms) => {
  const t = document.getElementById('toast'); if (!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(RD._tt); RD._tt = setTimeout(() => t.classList.remove('show'), ms || 2600);
};

/* ===== WIDGET RENDER ENGINE ===== */
'use strict';
RD.FONTS = {
  sans: 'system-ui, Roboto, "Segoe UI", Helvetica, Arial, sans-serif',
  cond: '"Roboto Condensed", "sans-serif-condensed", "Arial Narrow", "Helvetica Neue", sans-serif',
  wide: '"Eurostile", "Microgramma", "Bank Gothic", "Arial Black", Impact, sans-serif',
  mono: '"Roboto Mono", "DejaVu Sans Mono", "Courier New", monospace',
  serif: 'Georgia, "Times New Roman", serif',
  seg7: 'seg7'
};
RD.col = (c, skin) => {
  if (!c) return 'transparent';
  if (c[0] === '@') { const p = (skin && skin.pal) || {}; return p[c.slice(1)] || '#fff'; }
  return c;
};
RD.fontOf = (f, skin) => (!f || f === '@') ? ((skin && skin.font) || 'sans') : f;
RD.hq = true; RD._mc = {}; RD._mcN = 0;

/* ---------- 7-segment renderer (no font files needed) ---------- */
const SEG = {
  '0': 'abcdef', '1': 'bc', '2': 'abged', '3': 'abgcd', '4': 'fgbc', '5': 'afgcd', '6': 'afgedc', '7': 'abc', '8': 'abcdefg', '9': 'abcdfg',
  '-': 'g', ' ': '', 'N': 'abcef', 'n': 'ceg', 'R': 'eg', 'r': 'eg', 'P': 'abefg', 'E': 'adefg', 'F': 'aefg', 'A': 'abcefg', 'b': 'cdefg',
  'C': 'adef', 'c': 'deg', 'd': 'bcdeg', 'H': 'bcefg', 'h': 'cefg', 'L': 'def', 'o': 'cdeg', 'O': 'abcdef', 'S': 'afgcd', 't': 'defg', 'U': 'bcdef', 'u': 'cde', 'y': 'bcdfg', '_': 'd', '°': 'abfg'
};
RD.seg7Width = (str, h) => { let w = 0; for (const ch of String(str)) w += (ch === '.' || ch === ':') ? h * 0.22 : h * 0.62; return w; };

  str = String(str); const cw = h * 0.5, t = Math.max(1, h * 0.1), g = t * 0.25;
  const total = RD.seg7Width(str, h);
  let px = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  const top = y - h / 2;
  ctx.save(); ctx.translate(px, top); ctx.transform(1, 0, -0.08, 1, h * 0.04, 0);
  let ox = 0;
  const segRect = (s, ox) => {
    const hh = h / 2;
    switch (s) {
      case 'a': return [ox + t / 2 + g, 0, cw - t - 2 * g, t];
      case 'd': return [ox + t / 2 + g, h - t, cw - t - 2 * g, t];
      case 'g': return [ox + t / 2 + g, hh - t / 2, cw - t - 2 * g, t];
      case 'f': return [ox, t / 2 + g, t, hh - t / 2 - 2 * g];
      case 'b': return [ox + cw - t, t / 2 + g, t, hh - t / 2 - 2 * g];
      case 'e': return [ox, hh + g, t, hh - t / 2 - 2 * g];
      case 'c': return [ox + cw - t, hh + g, t, hh - t / 2 - 2 * g];
    }

  for (const ch of str) {
    if (ch === '.' || ch === ':') {

      if (ch === '.') ctx.fillRect(ox, h - t, t, t);
      else { ctx.fillRect(ox, h * 0.28, t, t); ctx.fillRect(ox, h * 0.66, t, t); }
      ox += h * 0.22; continue;
    }
    const on = SEG[ch] != null ? SEG[ch] : SEG[ch.toUpperCase()] || '';
    for (const s of 'abcdefg') {
      const lit = on.indexOf(s) >= 0;
      if (!lit && !ghost) continue;
      ctx.fillStyle = lit ? color : ghost;
      const r = segRect(s, ox); ctx.fillRect(r[0], r[1], r[2], r[3]);
    }
    ox += h * 0.62;
  }
  ctx.restore();
};

/* ---------- text helper ---------- */
RD.text = (ctx, str, x, y, px, o) => {
  o = o || {}; const f = o.font || 'sans';

  const fs = (o.italic ? 'italic ' : '') + (o.weight || 600) + ' ' + Math.max(1, px).toFixed(0) + 'px ' + (RD.FONTS[f] || RD.FONTS.sans);
  if (ctx._rdf !== fs) { ctx.font = fs; ctx._rdf = fs; }

  ctx.fillStyle = o.color || '#fff';
  if (o.glow && RD.hq) { ctx.shadowColor = o.glow; ctx.shadowBlur = px * 0.35; }

RD.measure = (ctx, str, px, f, weight) => {
  if (f === 'seg7') return RD.seg7Width(str, px * 0.78);
  const fs = (weight || 600) + ' ' + Math.max(1, px).toFixed(0) + 'px ' + (RD.FONTS[f] || RD.FONTS.sans);
  if (ctx._rdf !== fs) { ctx.font = fs; ctx._rdf = fs; }

};
RD.rr = (ctx, x, y, w, h, r) => {

  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
};
const D2R = Math.PI / 180;

/* range helper in display units */
RD.range = (w) => {
  const ch = w.src; let lo = RD.toDisp(ch, w.min), hi = RD.toDisp(ch, w.max);
  const c = RD.CH[ch];
  if (c && (c.kind === 'speed' || c.kind === 'temp') && RD.imp()) hi = Math.ceil(hi / 10) * 10;
  return [lo, hi];

RD.frac = (w, v) => { const [lo, hi] = RD.range(w); return RD.clamp((RD.toDisp(w.src, v) - lo) / ((hi - lo) || 1), 0, 1); };

/* ---------- face cache (static layers drawn once) ---------- */
RD.faceCache = new Map();
RD.cached = (ctx, w, skin, key, drawFn) => {
  if (RD.noCache) { ctx.save(); ctx.translate(w.x, w.y); drawFn(ctx); ctx.restore(); return; }
  const S = RD.scale * (RD.dpr || 1);
  const k = w.id + '|' + key + '|' + S.toFixed(3) + '|' + RD.settings.units + RD.settings.pressure + '|' + skin.id + '|' + w._v + '|' + w.w + 'x' + w.h + (RD.settings.night ? 'n' : '');
  let e = RD.faceCache.get(w.id);
  if (!e || e.k !== k) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.ceil(w.w * S)); c.height = Math.max(1, Math.ceil(w.h * S));
    const cx = c.getContext('2d'); cx.scale(S, S); drawFn(cx);

      this.hist.unshift({ at: Date.now(), res: this.res, src: RD.settings.source }); this.hist = this.hist.slice(0, 20); RD.store.set('perf', this.hist);
      RD.beep(1400, 1);
    }
  }
};

/* ===== TRIP LOGGER: auto start/end, GPS track, speed log, overspeed ===== */
'use strict';
RD.defaults.autoTrip = true; RD.defaults.speedLimit = 80;
if (RD.settings.autoTrip == null) RD.settings.autoTrip = true;
if (RD.settings.speedLimit == null) RD.settings.speedLimit = 80;

RD.Trips = {
  cur: null, list: RD.store.get('trips', []), movingFor: 0, stopFor: 0, simPos: [12.9716, 77.5946], ptT: 0, spT: 0, over: false,
  pos() {
    if (RD.settings.source === 'sim') return this.simPos;
    const l = RD.GPS.last; if (!l || Date.now() - (RD.gpsTime || 0) > 5000) return null; return [l.lat, l.lon];
  },
  start(manual) {
    if (this.cur) return;
    this.cur = { id: RD.uid(), start: Date.now(), end: 0, dist: 0, max: 0, moving: 0, over: 0, fuel: 0, pts: [], spd: [], src: RD.settings.source, manual: !!manual };
    this.stopFor = 0; RD.bus.emit('trip');
    RD.toast(manual ? 'Trip started' : 'Driving detected — trip recording started');
  },
  end(reason) {
    const c = this.cur; if (!c) return; this.cur = null; c.end = Date.now();
    RD.bus.emit('trip');
    if (c.dist < 0.1 && !c.manual) return;
    c.avg = c.moving > 0 ? c.dist / (c.moving / 3600) : 0;
    this.list.unshift(c); this.list = this.list.slice(0, 60);
    if (!this.save()) { this.list.forEach((t, i) => { if (i > 10) t.pts = t.pts.filter((_, k) => k % 3 === 0); }); this.save(); }
    RD.toast('Trip saved: ' + RD.fmt('tripDist', c.dist) + ' ' + RD.unitFor('tripDist') + (reason ? ' (' + reason + ')' : ''));
  },
  save() { return RD.store.set('trips', this.list); },
  remove(id) { this.list = this.list.filter(t => t.id !== id); this.save(); },
  tick(dt) {
    const s = RD.data.speed;
    if (RD.settings.source === 'sim') {
      const h = RD.data.heading * D2R, m = s / 3.6 * dt;
      this.simPos = [this.simPos[0] + Math.cos(h) * m / 111320, this.simPos[1] + Math.sin(h) * m / (111320 * Math.cos(this.simPos[0] * D2R))];
    }
    if (!this.cur) {
      if (!RD.settings.autoTrip) return;
      this.movingFor = s > 8 ? this.movingFor + dt : 0;
      if (this.movingFor > 15) { this.start(false); this.movingFor = 0; }
      return;
    }
    const c = this.cur;
    c.dist += s / 3600 * dt; if (s > 2) c.moving += dt; if (s > c.max) c.max = s; c.fuel += (RD.data.fuelRate || 0) / 3600 * dt;
    const lim = RD.settings.speedLimit;
    if (lim > 0) { const sd = RD.toDisp('speed', s); if (sd > lim && !this.over) { this.over = true; c.over++; } else if (sd < lim - 3) this.over = false; }
    this.ptT += dt; this.spT += dt;
    if (this.spT >= 2) { this.spT = 0; c.spd.push(Math.round(s)); if (c.spd.length > 5400) c.spd = c.spd.filter((_, i) => i % 2 === 0); }
    if (this.ptT >= 3) {
      this.ptT = 0; const p = this.pos();
      if (p) {
        const last = c.pts[c.pts.length - 1];
        if (!last || RD.haversine(last[0], last[1], p[0], p[1]) > 15) c.pts.push([+p[0].toFixed(5), +p[1].toFixed(5), Math.round(s)]);
        if (c.pts.length > 3000) c.pts = c.pts.filter((_, i) => i % 2 === 0);
      }
    }
    if (!c.manual) { this.stopFor = s < 2 ? this.stopFor + dt : 0; if (this.stopFor > 180) this.end('parked'); }
  },
  gpx(t) {
    const pts = t.pts.map((p, i) => `<trkpt lat="${p[0]}" lon="${p[1]}"><time>${new Date(t.start + (t.end - t.start) * i / Math.max(1, t.pts.length - 1)).toISOString()}</time></trkpt>`).join('\n');
    return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="DashForge" xmlns="http://www.topografix.com/GPX/1/1"><trk><name>Trip ${new Date(t.start).toLocaleString()}</name><trkseg>\n${pts}\n</trkseg></trk></gpx>`;
  }
};

/* draw a trip route (with optional OSM tiles) into a canvas */
RD.drawRoute = (cv, t, skinPal) => {
  const ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
  ctx.fillStyle = '#0d1420'; ctx.fillRect(0, 0, W, H);
  if (!t.pts.length) { ctx.fillStyle = '#8899aa'; ctx.font = '16px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('No GPS points recorded for this trip', W / 2, H / 2); return; }
  let la0 = 90, la1 = -90, lo0 = 180, lo1 = -180;
  t.pts.forEach(p => { la0 = Math.min(la0, p[0]); la1 = Math.max(la1, p[0]); lo0 = Math.min(lo0, p[1]); lo1 = Math.max(lo1, p[1]); });
  const mx = (lon, z) => (lon + 180) / 360 * 256 * Math.pow(2, z);
  const my = (lat, z) => { const s = Math.sin(lat * D2R); return (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * 256 * Math.pow(2, z); };
  let z = 17; while (z > 2 && (mx(lo1, z) - mx(lo0, z) > W * 0.85 || my(la0, z) - my(la1, z) > H * 0.85)) z--;
  const cx = (mx(lo0, z) + mx(lo1, z)) / 2, cy = (my(la0, z) + my(la1, z)) / 2, ox = cx - W / 2, oy = cy - H / 2;
  const drawLine = () => {
    ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let i = 1; i < t.pts.length; i++) {
      const a = t.pts[i - 1], b = t.pts[i], sp = b[2];
      ctx.strokeStyle = sp > RD.settings.speedLimit / (RD.imp() ? 0.621 : 1) ? '#ff3b5c' : sp > 50 ? '#ffd166' : '#2ee59d';
      ctx.beginPath(); ctx.moveTo(mx(a[1], z) - ox, my(a[0], z) - oy); ctx.lineTo(mx(b[1], z) - ox, my(b[0], z) - oy); ctx.stroke();
    }
    const s = t.pts[0], e = t.pts[t.pts.length - 1];
    [[s, '#2ee59d', 'S'], [e, '#ff3b5c', 'E']].forEach(([p, c, l]) => {
      const x = mx(p[1], z) - ox, y = my(p[0], z) - oy; ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, 9, 0, 7); ctx.fill();
      ctx.fillStyle = '#000'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(l, x, y);
    });
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(W - 150, H - 18, 150, 18); ctx.fillStyle = '#ccc'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right'; ctx.fillText('© OpenStreetMap contributors', W - 4, H - 8);
  };
  drawLine();
  if (!navigator.onLine) return;
  const tiles = []; const n = Math.pow(2, z);
  for (let tx = Math.floor(ox / 256); tx <= Math.floor((ox + W) / 256); tx++) for (let ty = Math.floor(oy / 256); ty <= Math.floor((oy + H) / 256); ty++) if (ty >= 0 && ty < n) tiles.push([tx, ty]);
  let loaded = 0, imgs = [];
  tiles.forEach(([tx, ty]) => {
    const im = new Image(); im.crossOrigin = 'anonymous';
    im.onload = im.onerror = () => {
      loaded++; if (loaded < tiles.length) return;
      ctx.fillStyle = '#0d1420'; ctx.fillRect(0, 0, W, H);
      imgs.forEach(o => { if (o.im.naturalWidth) { ctx.globalAlpha = 0.75; ctx.drawImage(o.im, o.tx * 256 - ox, o.ty * 256 - oy); ctx.globalAlpha = 1; } });
      ctx.fillStyle = 'rgba(5,10,20,.35)'; ctx.fillRect(0, 0, W, H); drawLine();
    };
    im.src = `https://tile.openstreetmap.org/${z}/${((tx % n) + n) % n}/${ty}.png`; imgs.push({ im, tx, ty });
  });
};

/* normalise skin: fill widget defaults, ids */
RD.normSkin = (s) => {
  s.screens.forEach(sc => sc.widgets.forEach(w => {
    const t = RD.WT[w.type]; if (!t) return;
    const ch = RD.CH[w.src];
    if (ch && w.src !== t.def.src && w.type !== 'shift' && w.type !== 'lamp') {
      if (w.min == null) w.min = ch.min; if (w.max == null) w.max = ch.max;
      if (w.type === 'radial') { if (w.numDiv == null) w.numDiv = w.src === 'rpm' ? 1000 : 1; if (w.red == null) w.red = w.src === 'rpm' ? RD.settings.redline : ''; }
    }
    const full = Object.assign({}, t.def, w); Object.assign(w, full);
    if (!w.id) w.id = RD.uid(); w._v = w._v || 0;
  }));
  s.pal = Object.assign({ primary: '#0ff', accent: '#f0f', warn: '#f33', text: '#fff', dim: '#888', track: '#222', face: 'none', ring: '#555', panel: 'rgba(0,0,0,.4)', line: '#333', ghost: 'rgba(255,255,255,.05)' }, s.pal);
  return s;
};
RD.BUILTIN.forEach(RD.normSkin);
RD.userSkins = (RD.store.get('skins', []) || []).map(RD.normSkin);
RD.allSkins = () => RD.BUILTIN.concat(RD.userSkins);
RD.skinById = (id) => RD.allSkins().find(s => s.id === id) || RD.BUILTIN[0];
RD.saveUserSkins = () => {
  const ok = RD.store.set('skins', RD.userSkins.map(s => { const c = RD.clone(s); c.screens.forEach(sc => sc.widgets.forEach(w => delete w._v)); return c; }));
  if (!ok) RD.toast('Storage full — export your skins and remove large images');
};

/* ===== APP: render loop, background, input, HUD ===== */
'use strict';
RD.$ = (s, r) => (r || document).querySelector(s);
RD.$$ = (s, r) => Array.from((r || document).querySelectorAll(s));
RD.anim = {};
RD.editing = false;

/* ---------- backgrounds ---------- */
RD.bgCache = { k: '', c: null };
RD.drawBg = (ctx, skin, W, H) => {
  const k = skin.id + JSON.stringify(skin.bg) + W + 'x' + H;
  if (RD.noCache || RD.bgCache.k !== k) {
    const c = RD.noCache ? null : document.createElement('canvas');
    let x = ctx;
    if (c) { c.width = W; c.height = H; x = c.getContext('2d'); }
    const b = skin.bg || { type: 'solid', c1: '#000' }, c1 = b.c1 || '#000', c2 = b.c2 || c1;
    if (b.type === 'radial' || b.type === 'synth') { const g = x.createRadialGradient(W / 2, H * 0.45, 10, W / 2, H / 2, Math.max(W, H) * 0.75); g.addColorStop(0, c1); g.addColorStop(1, c2); x.fillStyle = g; }
    else if (b.type === 'solid') x.fillStyle = c1;
    else { const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, c1); g.addColorStop(1, c2); x.fillStyle = g; }
    x.fillRect(0, 0, W, H);
    if (b.type === 'grid') {
      x.strokeStyle = 'rgba(255,255,255,0.035)'; x.lineWidth = 1; const step = Math.max(16, W / 48);
      for (let i = 0; i < W; i += step) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, H); x.stroke(); }
      for (let j = 0; j < H; j += step) { x.beginPath(); x.moveTo(0, j); x.lineTo(W, j); x.stroke(); }
    }
    if (b.type === 'carbon') {
      const s = Math.max(6, Math.round(W / 160));
      for (let i = 0; i < W; i += s * 2) for (let j = 0; j < H; j += s * 2) {
        const g1 = x.createLinearGradient(i, j, i + s, j + s); g1.addColorStop(0, 'rgba(255,255,255,0.06)'); g1.addColorStop(1, 'rgba(0,0,0,0.25)');
        x.fillStyle = g1; x.fillRect(i, j, s, s); x.fillRect(i + s, j + s, s, s);
        const g2 = x.createLinearGradient(i + s, j, i + 2 * s, j + s); g2.addColorStop(0, 'rgba(0,0,0,0.3)'); g2.addColorStop(1, 'rgba(255,255,255,0.04)');
        x.fillStyle = g2; x.fillRect(i + s, j, s, s); x.fillRect(i, j + s, s, s);
      }
      const v = x.createRadialGradient(W / 2, H / 2, H * 0.2, W / 2, H / 2, W * 0.7); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.7)'); x.fillStyle = v; x.fillRect(0, 0, W, H);
    }
    if (b.type === 'synth') {
      const hz = H * 0.62, sun = x.createLinearGradient(0, H * 0.2, 0, hz); sun.addColorStop(0, '#ffd319'); sun.addColorStop(0.5, '#ff2975'); sun.addColorStop(1, '#8c1eff');
      x.save(); x.globalAlpha = 0.28; x.fillStyle = sun; x.beginPath(); x.arc(W / 2, hz, H * 0.32, Math.PI, 0); x.fill();
      x.globalCompositeOperation = 'destination-out'; for (let i = 0; i < 7; i++) { const yy = hz - H * 0.03 - i * H * 0.04; x.fillRect(0, yy, W, H * 0.008 + i * 0.6); } x.restore();
      x.fillStyle = 'rgba(10,0,25,0.85)'; x.fillRect(0, hz, W, H - hz);
      x.strokeStyle = 'rgba(255,47,185,0.35)'; x.lineWidth = 1.5;
      for (let i = 0; i < 14; i++) { const y = hz + (H - hz) * Math.pow(i / 13, 2); x.beginPath(); x.moveTo(0, y); x.lineTo(W, y); x.stroke(); }
      for (let i = -20; i <= 20; i++) { x.beginPath(); x.moveTo(W / 2 + i * W * 0.012, hz); x.lineTo(W / 2 + i * W * 0.09, H); x.stroke(); }
    }
    if (c) RD.bgCache = { k, c };
  }
  if (!RD.noCache) ctx.drawImage(RD.bgCache.c, 0, 0, W, H);
};

/* ---------- render one screen of a skin ---------- */
RD.renderScreen = (ctx, skin, screen, devW, devH, s, ox, oy, dt) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  RD.drawBg(ctx, skin, devW, devH);
  ctx.setTransform(s, 0, 0, s, ox, oy);
  const scr = skin.screens[screen] || skin.screens[0];
  for (const w of scr.widgets) {
    const t = RD.WT[w.type]; if (!t) continue;
    let v = RD.data[w.src];
    if (v == null || isNaN(v)) v = 0;
    if (dt != null && w.smooth > 0) {
      const a = RD.anim[w.id]; const nv = a == null ? v : a + (v - a) * Math.min(1, dt * w.smooth);
      RD.anim[w.id] = nv; v = nv;
    }
    try { t.draw(ctx, w, v, skin); } catch (e) { if (!RD._errShown) { RD._errShown = 1; console.error(e); } }
  }
};

/* ---------- main stage ---------- */
RD.view = { s: 1, ox: 0, oy: 0 };
RD.layout = () => {
  const st = RD.$('#stage'), cv = RD.$('#cv');
  const r = st.getBoundingClientRect();
  const q = RD.settings.quality;
  RD.dpr = Math.min(window.devicePixelRatio || 1, q === 'low' ? 1 : q === 'high' ? 2.5 : (RD.lowPerf ? 1 : 1.75));
  cv.width = Math.round(r.width * RD.dpr); cv.height = Math.round(r.height * RD.dpr);
  cv.getContext('2d')._rdf = null; cv.style.width = r.width + 'px'; cv.style.height = r.height + 'px';
  const s = Math.min(r.width / RD.W, r.height / RD.H);
  RD.scale = s; RD.view = { s, ox: (r.width - RD.W * s) / 2, oy: (r.height - RD.H * s) / 2, rect: r };
  RD.faceCache.clear(); RD.bgCache.k = '';
};
RD.skin = () => RD.skinById(RD.settings.skin);

RD.setScreen = (i) => {
  const n = RD.skin().screens.length; RD.settings.screen = ((i % n) + n) % n; RD.saveSettings(); RD.updateDots();

};
RD.flashName = (n) => { const e = RD.$('#scrname'); e.textContent = n; e.classList.add('show'); clearTimeout(RD._fn); RD._fn = setTimeout(() => e.classList.remove('show'), 1200); };
RD.updateDots = () => {
  const n = RD.skin().screens.length, d = RD.$('#dots');
  d.innerHTML = n > 1 ? Array.from({ length: n }, (_, i) => `<i class="${i === RD.settings.screen ? 'on' : ''}" data-i="${i}"></i>`).join('') : '';
};

/* ---------- loop ---------- */
RD.fps = 0; RD._frames = 0; RD._fpsT = 0; RD._last = 0; RD._alertT = 0; RD._slow = 0;
RD.frame = (now) => {
  requestAnimationFrame(RD.frame);
  const modal = !!document.getElementById('modal');
  const cap = modal ? 6 : (RD.lowPerf && RD.settings.quality === 'auto' ? Math.min(30, RD.settings.maxFps || 60) : (RD.settings.maxFps || 60));
  const minDt = 1000 / cap - 1;
  if (now - RD._last < minDt) return;
  const dt = Math.min(0.1, (now - RD._last) / 1000 || 0.016); RD._last = now;
  const t0 = performance.now();
  RD.derive(dt); RD.Trips.tick(dt);
  RD._alertT += dt; if (RD._alertT > 0.25) { RD._alertT = 0; RD.checkAlerts(); RD.updateHud(); }
  const cv = RD.$('#cv'), ctx = cv.getContext('2d'), v = RD.view, d = RD.dpr;
  RD.renderScreen(ctx, RD.skin(), RD.settings.screen, cv.width, cv.height, v.s * d, v.ox * d, v.oy * d, dt);
  if (RD.editing && RD.Editor) RD.Editor.overlay(ctx);
  const al = RD.activeAlert, ab = RD.$('#alertbar');
  if (al) { ab.textContent = '⚠ ' + al.msg; ab.classList.add('show'); RD.$('#stage').classList.toggle('alarm', Date.now() % 900 < 450); }
  else if (ab.classList.contains('show')) { ab.classList.remove('show'); RD.$('#stage').classList.remove('alarm'); }
  RD._frames++; RD._fpsT += dt;
  const ft = performance.now() - t0; if (document.getElementById('modal')) return; RD._slow = RD._slow * 0.95 + ft * 0.05;
  if (RD._fpsT >= 1) {
    RD.fps = RD._frames / RD._fpsT; RD._frames = 0; RD._fpsT = 0;
    RD.$('#fps').textContent = RD.settings.fps ? RD.fps.toFixed(0) + ' fps · ' + RD._slow.toFixed(1) + ' ms' : '';
    if (RD.settings.quality === 'auto') {
      if (!RD.lowPerf && !document.getElementById('modal') && (RD._slow > 20 || RD.fps < 30)) { RD.lowPerf = true; RD.hq = false; RD.layout(); }
    } else RD.hq = RD.settings.quality !== 'low';
  }
};

/* ---------- HUD ---------- */
RD.updateHud = () => {
  const src = RD.settings.source, st = RD.status;
  const pill = RD.$('#srcpill');
  let txt = RD.Sources[src].name, cls = 'ok';
  if (src === 'obd') { txt = 'OBD2 · ' + st.obd; cls = st.obd === 'live' ? 'ok' : st.obd === 'error' || st.obd === 'no-ecu' ? 'bad' : 'warn'; }
  if (src === 'gps') { txt = 'GPS · ' + st.gps; cls = st.gps === 'fix' ? 'ok' : st.gps === 'error' ? 'bad' : 'warn'; }
  if (src === 'sim') { txt = 'Demo mode'; cls = 'warn'; }
  if (RD.passenger()) txt = (st.gps === 'fix' ? '🛰 GPS' : '🛰 GPS ' + st.gps) + ' · Passenger';
  pill.textContent = txt; pill.className = 'pill ' + cls;
  const tp = RD.$('#trippill');
  if (RD.Trips.cur) { tp.style.display = ''; tp.textContent = '● REC ' + RD.fmt('tripDist', RD.Trips.cur.dist) + ' ' + RD.unitFor('tripDist'); } else tp.style.display = 'none';
  const pp = RD.$('#perfpill');
  if (RD.Perf.state === 'armed' || RD.Perf.state === 'run') { pp.style.display = ''; pp.textContent = RD.Perf.state === 'armed' ? 'PERF ARMED' : 'PERF ' + RD.Perf.t.toFixed(1) + 's'; } else pp.style.display = 'none';
  const auto = RD.settings.autoNight && (new Date().getHours() >= 19 || new Date().getHours() < 6);
  RD.$('#night').style.opacity = RD.settings.night || auto ? 0.45 : (1 - RD.settings.brightness);
  if (RD.Media) RD.Media.guard();
};
RD.showHud = () => {
  document.body.classList.add('hud-on'); clearTimeout(RD._hudT);
  RD._hudT = setTimeout(() => { if (!RD.editing) document.body.classList.remove('hud-on'); }, 4500);
};

/* ---------- input: swipe screens, tap HUD ---------- */
RD.initInput = () => {
  const st = RD.$('#stage'); let sx = 0, sy = 0, t0 = 0, down = false;
  st.addEventListener('pointerdown', (e) => {
    RD.unlockAudio(); RD.requestWake();
    if (RD.editing) return RD.Editor.down(e);
    down = true; sx = e.clientX; sy = e.clientY; t0 = Date.now();
  });
  window.addEventListener('pointermove', (e) => { if (RD.editing) RD.Editor.move(e); });
  window.addEventListener('pointerup', (e) => {
    if (RD.editing) return RD.Editor.up(e);
    if (!down) return; down = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) RD.setScreen(RD.settings.screen + (dx < 0 ? 1 : -1));
    else if (Math.abs(dx) < 10 && Math.abs(dy) < 10 && Date.now() - t0 < 400) RD.showHud();
  });
  RD.$('#dots').addEventListener('click', (e) => { const i = e.target.dataset.i; if (i != null) RD.setScreen(+i); });
  window.addEventListener('resize', () => { clearTimeout(RD._rz); RD._rz = setTimeout(RD.layout, 120); });
  window.addEventListener('keydown', (e) => {
    if (RD.editing) return RD.Editor.key(e);
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'ArrowRight') RD.setScreen(RD.settings.screen + 1);
    if (e.key === 'ArrowLeft') RD.setScreen(RD.settings.screen - 1);
    if (e.key === 'm') RD.UI.menu();
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') RD.requestWake(true); });
};
RD.unlockAudio = () => { if (RD._au) return; RD._au = 1; try { RD.audio = RD.audio || new (window.AudioContext || window.webkitAudioContext)(); RD.audio.resume(); } catch (e) {} };
RD.wakeLock = null;
RD.requestWake = async (force) => {
  if (!RD.settings.wake || !('wakeLock' in navigator)) return;
  if (RD.wakeLock && !force) return;
  try { RD.wakeLock = await navigator.wakeLock.request('screen'); RD.wakeLock.addEventListener('release', () => RD.wakeLock = null); } catch (e) {}
};
RD.fullscreen = () => {
  const d = document.documentElement;
  if (!document.fullscreenElement) { (d.requestFullscreen || d.webkitRequestFullscreen || (() => {})).call(d); try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} }
  else (document.exitFullscreen || document.webkitExitFullscreen).call(document);
};

/* ---------- boot ---------- */
RD.boot = () => {
  RD.hq = RD.settings.quality !== 'low';
  document.body.classList.toggle('passenger', RD.passenger());
  if (!RD.skinById(RD.settings.skin)) RD.settings.skin = 'neon';
  RD.layout(); RD.updateDots(); RD.initInput();
  RD.Sources[RD.settings.source] ? RD.setSource(RD.settings.source) : RD.setSource('sim');
  if (RD.Media) RD.Media.init();
  RD.UI.initHud();
  requestAnimationFrame(RD.frame);
  RD.showHud();
  if (RD.nativeL && RD.nativeL() && !RD.store.get('homeAsked', false)) { setTimeout(() => RD.UI.homeSetup(), 1200); }
  else if (!RD.store.get('welcomed', false)) { RD.store.set('welcomed', true); setTimeout(() => RD.UI.welcome(), 500); }
  if ('serviceWorker' in navigator && location.protocol === 'https:' && !window.Capacitor) navigator.serviceWorker.register('sw.js').catch(() => {});
};
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); RD.installEvt = e; });
window.addEventListener('load', RD.boot);

        </div>`).join('') : '<p class="hint">No trips yet. Drive with GPS or OBD2 connected and trips are logged automatically.</p>'}</div>
      ${T.list.length ? '<div class="row"><button class="btn sm danger" id="tr-clear">Delete all trips</button></div>' : ''}`, { wide: true });
    b.querySelector('#tr-ss').onclick = () => { c ? T.end('manual') : T.start(true); RD.UI.trips(); };
    b.querySelector('#tr-auto').onchange = (e) => { RD.settings.autoTrip = e.target.checked; RD.saveSettings(); };
    b.querySelector('#tr-lim').onchange = (e) => { RD.settings.speedLimit = +e.target.value; RD.saveSettings(); };
    const clr = b.querySelector('#tr-clear'); if (clr) clr.onclick = () => { if (confirm('Delete all saved trips?')) { T.list = []; T.save(); RD.UI.trips(); } };
    b.querySelectorAll('.trip').forEach(el => el.onclick = () => RD.UI.trip(el.dataset.id));
  },
  trip(id) {
    const t = RD.Trips.list.find(x => x.id === id); if (!t) return;
    const u = RD.unitFor('tripDist'), su = RD.unitFor('speed');
    const b = RD.UI.modal('Trip — ' + new Date(t.start).toLocaleString(), `
      <canvas id="route" width="900" height="420" class="route"></canvas>
      <div class="kpis">
        ${[['Distance', RD.fmt('tripDist', t.dist) + ' ' + u], ['Duration', RD.fmtTime((t.end - t.start) / 1000)], ['Moving', RD.fmtTime(t.moving)], ['Avg speed', RD.fmt('speed', t.avg) + ' ' + su],
          ['Max speed', RD.fmt('speed', t.max) + ' ' + su], ['Over limit', t.over + '×'], ['Fuel (est.)', t.fuel ? t.fuel.toFixed(2) + ' L' : '—'], ['GPS points', t.pts.length]]
        .map(k => `<div><small>${k[0]}</small><b>${k[1]}</b></div>`).join('')}
      </div>
      <canvas id="spdc" width="900" height="160" class="route"></canvas>
      <div class="row"><button class="btn" id="t-gpx">Export GPX</button><button class="btn" id="t-maps">Open in Google Maps</button><button class="btn danger" id="t-del">Delete</button></div>`, { wide: true, back: () => RD.UI.trips() });
    RD.drawRoute(b.querySelector('#route'), t);
    const sc = b.querySelector('#spdc'), x = sc.getContext('2d'), W = sc.width, H = sc.height, sp = t.spd || [];
    x.fillStyle = '#0d1420'; x.fillRect(0, 0, W, H);
    if (sp.length > 1) {
      const mxv = Math.max(60, ...sp); x.strokeStyle = '#4fc3ff'; x.lineWidth = 2; x.beginPath();
      sp.forEach((v, i) => { const px = i / (sp.length - 1) * W, py = H - 10 - v / mxv * (H - 30); i ? x.lineTo(px, py) : x.moveTo(px, py); }); x.stroke();
      const lim = RD.settings.speedLimit / (RD.imp() ? 0.621371 : 1), ly = H - 10 - lim / mxv * (H - 30);
      x.strokeStyle = '#ff3b5c'; x.setLineDash([6, 6]); x.beginPath(); x.moveTo(0, ly); x.lineTo(W, ly); x.stroke(); x.setLineDash([]);
      x.fillStyle = '#8899aa'; x.font = '13px sans-serif'; x.fillText('Speed over time (' + su + ')  — red line = limit', 10, 16);
    }
    b.querySelector('#t-gpx').onclick = () => RD.download('trip-' + new Date(t.start).toISOString().slice(0, 16).replace(/:/g, '') + '.gpx', RD.Trips.gpx(t), 'application/gpx+xml');
    b.querySelector('#t-maps').onclick = () => {
      if (t.pts.length < 2) return RD.toast('Not enough GPS points');
      const pick = [t.pts[0]].concat(t.pts.filter((_, i) => i % Math.ceil(t.pts.length / 8) === 0).slice(1, 9)).concat([t.pts[t.pts.length - 1]]);
      window.open('https://www.google.com/maps/dir/' + pick.map(p => p[0] + ',' + p[1]).join('/'), '_blank');
    };
    b.querySelector('#t-del').onclick = () => { if (confirm('Delete this trip?')) { RD.Trips.remove(id); RD.UI.trips(); } };
  },

  /* ---------- performance ---------- */
  perf() {
    const P = RD.Perf;
    const b = RD.UI.modal('Performance Timer', `
      <div class="perfbig"><div id="pf-state"></div><div id="pf-time">0.00 s</div><div id="pf-spd"></div></div>

    const upd = () => {
      const st = { off: 'Ready', armed: RD.data.speed > 1 ? 'Armed — stop the vehicle' : 'Armed — GO when ready!', run: 'Running…', done: 'Finished' }[P.state];

  /* ---------- device compatibility check ---------- */
  device() {
    const ua = navigator.userAgent, and = (ua.match(/Android\s([\d.]+)/) || [])[1], chrome = (ua.match(/Chrome\/([\d.]+)/) || [])[1];
    const checks = [
      ['Android version', and || 'not Android', and ? (parseFloat(and) >= 7 ? 'ok' : 'warn') : 'info'],
      ['Browser engine', chrome ? 'Chrome ' + chrome.split('.')[0] : 'Other', chrome && parseInt(chrome) >= 80 ? 'ok' : 'warn'],
      ['Screen', screen.width + '×' + screen.height + ' @' + (window.devicePixelRatio || 1) + 'x', 'ok'],
      ['CPU cores / RAM', (navigator.hardwareConcurrency || '?') + ' cores / ' + (navigator.deviceMemory ? navigator.deviceMemory + ' GB' : '?'), (navigator.hardwareConcurrency || 4) >= 4 ? 'ok' : 'warn'],
      ['Current FPS', RD.fps.toFixed(0) + ' fps (' + RD._slow.toFixed(1) + ' ms/frame)', RD.fps >= 40 ? 'ok' : RD.fps >= 24 ? 'warn' : 'bad'],
      ['Web Bluetooth (BLE OBD2)', navigator.bluetooth ? 'available' : 'not available', navigator.bluetooth ? 'ok' : 'warn'],
      ['GPS / Geolocation', navigator.geolocation ? 'available' + (location.protocol === 'https:' ? '' : ' (needs https)') : 'missing', navigator.geolocation ? 'ok' : 'bad'],
      ['Motion sensors', 'DeviceMotionEvent' in window ? (RD.Motion.raw[0] || RD.Motion.raw[1] ? 'receiving data' : 'supported (move tablet to test)') : 'missing', 'DeviceMotionEvent' in window ? 'ok' : 'warn'],
      ['Keep screen awake', 'wakeLock' in navigator ? 'supported' : 'not supported — set screen timeout to max in Android settings', 'wakeLock' in navigator ? 'ok' : 'warn'],
      ['Fullscreen', document.fullscreenEnabled ? 'supported' : 'limited', document.fullscreenEnabled ? 'ok' : 'warn'],
      ['Voice alerts', 'speechSynthesis' in window ? 'supported' : 'not supported', 'speechSynthesis' in window ? 'ok' : 'warn'],
      ['Online', navigator.onLine ? 'yes' : 'offline', 'info']
    ];
    const rep = checks.map(c => c[0] + ': ' + c[1]).join('\n') + '\nUA: ' + ua;
    let framed = false; try { framed = window.top !== window; } catch (e) { framed = true; }
    const b = RD.UI.modal('Device Check', `${framed ? '<p class="warn card">⚠ Running inside the Claude preview frame: GPS, motion sensors, Bluetooth, YouTube and downloads are blocked here by the frame. They work in the installed tablet version.</p>' : ''}<table class="res chk">${checks.map(c => `<tr><td>${c[0]}</td><td class="${c[2]}">${esc(c[1])}</td></tr>`).join('')}</table>
      <p class="hint">Verdict: ${and && parseFloat(and) < 7 ? '⚠ Android below 7 — the web version may struggle; the native APK targets Android 7+.' : 'This device can run DashForge. ' + (navigator.bluetooth ? 'BLE OBD2 works here.' : 'For OBD2, use the APK build.')}</p>
      <div class="row"><button class="btn primary" id="dv-copy">Copy report</button><button class="btn" id="dv-gps">Test GPS</button><button class="btn" id="dv-motion">Test motion sensor</button></div>
      <textarea readonly class="rep">${esc(rep)}</textarea>`);
    b.querySelector('#dv-copy').onclick = () => { const ta = b.querySelector('.rep'); ta.select(); try { navigator.clipboard.writeText(rep); } catch (e) { document.execCommand('copy'); } RD.toast('Report copied — paste it to Claude'); };
    b.querySelector('#dv-gps').onclick = () => { RD.GPS.start(); RD.toast('GPS started — allow location permission'); };
    b.querySelector('#dv-motion').onclick = async () => { await RD.Motion.start(); setTimeout(() => RD.UI.device(), 1500); };
  },

  },
  start() {

    RD.editing = true; document.body.classList.add('editing', 'hud-on'); this.sel = null; this.undo = [];

  },
  stop() {

  },
  screen() { return RD.skin().screens[RD.settings.screen]; },
  snapshot() { this.undo.push(JSON.stringify(RD.skin())); if (this.undo.length > 40) this.undo.shift(); },
  doUndo() {

    cur.screens.forEach(sc => sc.widgets.forEach(w => w._v = (w._v || 0) + 1)); this.sel = null; RD.faceCache.clear(); RD.bgCache.k = ''; this.panel(); RD.updateDots();
  },
  changed(w) { if (w) w._v = (w._v || 0) + 1; clearTimeout(this._st); this._st = setTimeout(() => RD.saveUserSkins(), 600); },
  toV(e) { const r = RD.view.rect || RD.$('#stage').getBoundingClientRect(), v = RD.view; return [(e.clientX - r.left - v.ox) / v.s, (e.clientY - r.top - v.oy) / v.s]; },
  hit(x, y) { const ws = this.screen().widgets; for (let i = ws.length - 1; i >= 0; i--) { const w = ws[i]; if (x >= w.x && x <= w.x + w.w && y >= w.y && y <= w.y + w.h) return w; } return null; },
  down(e) {
    const [x, y] = this.toV(e), s = this.sel, hs = 22 / RD.view.s * 0.8 + 8;
    if (s && Math.abs(x - (s.x + s.w)) < hs && Math.abs(y - (s.y + s.h)) < hs) { this.snapshot(); this.drag = { mode: 'resize', w: s, x0: x, y0: y, ow: s.w, oh: s.h }; return; }

  },
  move(e) {
    const d = this.drag; if (!d) return; const [x, y] = this.toV(e), g = this.snap ? this.grid : 1, sn = (v) => Math.round(v / g) * g;
    if (d.mode === 'move') { d.w.x = sn(d.ox + x - d.x0); d.w.y = sn(d.oy + y - d.y0); d.moved = true; }
    else { d.w.w = Math.max(20, sn(d.ow + x - d.x0)); d.w.h = Math.max(12, sn(d.oh + y - d.y0)); if (e.shiftKey && d.w.type === 'radial') d.w.h = d.w.w; }

  up() { if (this.drag) { if (this.drag.mode === 'move' && !this.drag.moved) this.undo.pop(); this.drag = null; this.changed(); } },
  key(e) {

  },
  overlay(ctx) {
    const v = RD.view, d = RD.dpr; ctx.setTransform(v.s * d, 0, 0, v.s * d, v.ox * d, v.oy * d);
    if (this.snap) { ctx.fillStyle = 'rgba(255,255,255,0.08)'; for (let x = 0; x <= RD.W; x += 40) for (let y = 0; y <= RD.H; y += 40) ctx.fillRect(x - 1, y - 1, 2, 2); }

  dup() { const w = this.sel; if (!w) return; this.snapshot(); const c = RD.clone(w); c.id = RD.uid(); c.x += 20; c.y += 20; this.screen().widgets.push(c); this.sel = c; this.changed(c); this.panel(); },
  order(dir) { const w = this.sel; if (!w) return; this.snapshot(); const ws = this.screen().widgets, i = ws.indexOf(w); ws.splice(i, 1); if (dir > 0) ws.push(w); else ws.unshift(w); this.changed(); },

    p.querySelectorAll('[data-c]').forEach(s => s.onchange = () => {
      const k = s.dataset.c, cc = p.querySelector('[data-cc="' + k + '"]');
      if (s.value === 'custom') { cc.style.opacity = 1; set(k, cc.value); } else { cc.style.opacity = .35; set(k, s.value); }
    });
    p.querySelectorAll('[data-cc]').forEach(c => c.oninput = () => { const k = c.dataset.cc; p.querySelector('[data-c="' + k + '"]').value = 'custom'; c.style.opacity = 1; w[k] = c.value; this.changed(w); });
    p.querySelectorAll('[data-img]').forEach(f => f.onchange = () => {
      const file = f.files[0]; if (!file) return; const r = new FileReader();
      r.onload = () => { const im = new Image(); im.onload = () => { const m = 640, s = Math.min(1, m / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * s; c.height = im.height * s; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); set(f.dataset.img, c.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', 0.85)); this.panel(); }; im.src = r.result; };
      r.readAsDataURL(file);
    });
    p.querySelectorAll('[data-clrimg]').forEach(b => b.onclick = () => { set(b.dataset.clrimg, ''); this.panel(); });
    RD.$('#ep-dup').onclick = () => this.dup(); RD.$('#ep-del').onclick = () => this.del();
  }
};
RD.toHex = (c) => {
  if (!c) return '#000000'; if (/^#[0-9a-f]{6}$/i.test(c)) return c;
  if (/^#[0-9a-f]{3}$/i.test(c)) return '#' + c.slice(1).split('').map(x => x + x).join('');
  const m = /rgba?\(([^)]+)\)/.exec(c); if (m) { const [r, g, b] = m[1].split(',').map(Number); return '#' + [r, g, b].map(x => Math.round(x).toString(16).padStart(2, '0')).join(''); }
  return '#000000';
};
